plugins {
    id 'com.android.application'
}

// GitHub Actions numbers every build. Using that number as the version lets each
// new APK install on top of the previous one.
def buildNumber = (System.getenv('GITHUB_RUN_NUMBER') ?: '1').toInteger()

android {
    namespace 'com.touhidgit.pocketmogul'
    compileSdk 35

    defaultConfig {
        applicationId 'com.touhidgit.pocketmogul'
        minSdk 26
        targetSdk 34
        // +2000 keeps every v3 (Cash Climb) build newer than any v2 (1000 + n) or v1 build,
        // even from a fresh repository where the run numbers start again at 1.
        // applicationId stays com.touhidgit.pocketmogul so v3 installs over v2 and keeps the save.
        versionCode 2000 + buildNumber
        versionName "3.0.${buildNumber}"
    }

    signingConfigs {
        // One fixed key for every build, so updates install without uninstalling
        // the game first (which would wipe your save).
        shared {
            storeFile file('pocketmogul.p12')
            storeType 'pkcs12'
            storePassword 'pocketmogul'
            keyAlias 'pocketmogul'
            keyPassword 'pocketmogul'
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.shared
        }
        release {
            minifyEnabled false
            signingConfig signingConfigs.shared
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    // The game itself lives in ../game (index.html, style.css, game.js)
    sourceSets {
        main {
            assets.srcDirs = ['../game']
        }
    }

    lint {
        checkReleaseBuilds false
        abortOnError false
    }
}
