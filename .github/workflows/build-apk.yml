name: Build APK

on:
  push:
    branches: ['**']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Get the code
        uses: actions/checkout@v5

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Gradle 8.10.2
        run: |
          curl -sSL -o "$RUNNER_TEMP/gradle.zip" https://services.gradle.org/distributions/gradle-8.10.2-bin.zip
          unzip -q "$RUNNER_TEMP/gradle.zip" -d "$RUNNER_TEMP/gradle"
          echo "$RUNNER_TEMP/gradle/gradle-8.10.2/bin" >> "$GITHUB_PATH"

      - name: Build the APK
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: Name the APK
        run: |
          mkdir -p out
          cp app/build/outputs/apk/release/app-release.apk "out/CashClimb-${{ github.run_number }}.apk"

      - name: Attach the APK to this run
        uses: actions/upload-artifact@v5
        with:
          name: CashClimb-APK
          path: out/*.apk

      - name: Publish the APK as a Release (easy phone download)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "build-${{ github.run_number }}" out/*.apk \
            --target "${{ github.sha }}" \
            --title "Cash Climb (build ${{ github.run_number }})" \
            --notes "Open this page on your Android phone, tap the .apk file below, then tap Install."
